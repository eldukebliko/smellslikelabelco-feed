name: Diario (feed + reel de Instagram)
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
concurrency:
  group: diario
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install pillow==10.4.0
      - name: Feed de Google
        env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
        run: python build_feed.py
      - name: Reel del día
        env:
          PRINTIFY_TOKEN: ${{ secrets.PRINTIFY_TOKEN }}
        run: python reels/make_reel.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
  publicar:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Esperar a que GitHub Pages sirva el vídeo
        run: sleep 60
      - name: Publicar en Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PAGES_URL: https://eldukebliko.github.io/smellslikelabelco-feed
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p public/reels
          curl -sf https://eldukebliko.github.io/smellslikelabelco-feed/reels/next.json -o public/reels/next.json
          python reels/publish_ig.py
      - name: Guardar lo publicado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels/posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Reel publicado" && git push)
